<svg width="600" height="100" viewBox="0 0 600 100" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>GET_NEXT_LINE — Lightsaber ignition</title>
  <desc>Green lightsaber ignites to reveal GET_NEXT_LINE · VALIDATED</desc>
  <defs>
