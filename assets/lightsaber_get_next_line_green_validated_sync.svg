    <filter id="g3" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="100" rx="8" fill="#0d1117"/>
  <rect x="28" y="32" width="84" height="36" rx="5" fill="#2d3a2d" stroke="#446644" stroke-width="1"/>
  <rect x="28" y="32" width="18" height="36" rx="4" fill="#1a2a1a"/>
  <rect x="52" y="37" width="8" height="26" rx="2" fill="#111a11"/>
  <rect x="64" y="39" width="28" height="5" rx="2" fill="#00cc44" opacity="0.9"/>
  <rect x="64" y="52" width="28" height="5" rx="2" fill="#00cc44" opacity="0.4"/>
  <circle cx="102" cy="50" r="6" fill="#001100" stroke="#00cc44" stroke-width="1"/>
  <circle cx="102" cy="50" r="3.5" fill="#00ff55" opacity="0"><animate attributeName="opacity" values="0;1;0.7" dur="0.3s" fill="freeze" begin="0.2s"/></circle>
  <g clip-path="url(#bc3)">
