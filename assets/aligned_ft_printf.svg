  <rect width="600" height="100" rx="8" fill="#0d1117"/>
  <rect x="28" y="32" width="84" height="36" rx="3" fill="#2a2a2a" stroke="#444444" stroke-width="1"/>
  <rect x="28" y="32" width="18" height="36" rx="3" fill="#1a1a1a"/>
  <rect x="52" y="37" width="8" height="26" rx="1" fill="#111111"/>
