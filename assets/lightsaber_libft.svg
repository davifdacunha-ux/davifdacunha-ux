<svg width="600" height="100" viewBox="0 0 600 100" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>LIBFT — Lightsaber ignition</title>
  <desc>Blue lightsaber ignites to reveal LIBFT · VALIDATED</desc>
  <defs>
    <clipPath id="bc1"><rect x="110" y="30" width="0" height="40" rx="20"><animate attributeName="width" from="0" to="470" dur="1.2s" fill="freeze" begin="0.4s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/></rect></clipPath>
    <filter id="g1" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="100" rx="8" fill="#0d1117"/>
  <rect x="28" y="32" width="84" height="36" rx="5" fill="#3a3a4a" stroke="#555566" stroke-width="1"/>
  <rect x="28" y="32" width="18" height="36" rx="4" fill="#222233"/>
  <rect x="52" y="37" width="8" height="26" rx="2" fill="#1a1a2a"/>
  <rect x="64" y="39" width="28" height="5" rx="2" fill="#00aaff" opacity="0.8"/>
  <rect x="64" y="52" width="28" height="5" rx="2" fill="#00aaff" opacity="0.4"/>
  <circle cx="102" cy="50" r="6" fill="#111122" stroke="#00aaff" stroke-width="1"/>
  <circle cx="102" cy="50" r="3.5" fill="#00d4ff" opacity="0"><animate attributeName="opacity" values="0;1;0.7" dur="0.3s" fill="freeze" begin="0.2s"/></circle>
  <g clip-path="url(#bc1)">
